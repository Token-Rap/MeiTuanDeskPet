name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"
      draft:
        description: "Create the GitHub Release as a draft"
        type: boolean
        required: true
        default: false
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

env:
  APP_DISPLAY_NAME: MeiTuanDeskPet
  APP_BINARY_NAME: meituan_desk_pet

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        shell: bash
        run: |
          RELEASE_VERSION="${{ inputs.version || github.ref_name }}"
          APP_VERSION="${RELEASE_VERSION#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --build-name "$APP_VERSION" --build-number "${{ github.run_number }}"

      - name: Package DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/${APP_BINARY_NAME}.app"
          DIST_DIR="dist/macos"
          DMG_ROOT="$DIST_DIR/dmg-root"
          mkdir -p "$DMG_ROOT" "$DIST_DIR"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "$APP_DISPLAY_NAME" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DIST_DIR/${APP_DISPLAY_NAME}-macos-${RELEASE_VERSION}.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$DIST_DIR/${APP_DISPLAY_NAME}-macos-${RELEASE_VERSION}.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        shell: pwsh
        run: |
          $releaseVersion = "${{ inputs.version || github.ref_name }}"
          $appVersion = $releaseVersion.TrimStart("v")
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Get dependencies
        run: flutter pub get

      - name: Test update manifest
        run: python -m unittest discover -s test -p "*_test.py"

      - name: Build Windows app
        run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "${{ github.run_number }}"

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/windows/MeiTuanDeskPet-windows-x64-$env:RELEASE_VERSION.zip" `
            -Force

      - name: Build EXE installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="$env:APP_VERSION" installer/windows/MeiTuanDeskPet.iss
          Move-Item `
            -Path "dist/windows/MeiTuanDeskPet-windows-x64-setup.exe" `
            -Destination "dist/windows/MeiTuanDeskPet-windows-x64-setup-$env:RELEASE_VERSION.exe" `
            -Force

      - name: Generate Windows update manifest
        shell: pwsh
        run: python scripts/windows_update_manifest.py --version "$env:APP_VERSION" --build "${{ github.run_number }}" --tag "$env:RELEASE_VERSION"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        shell: bash
        run: |
          RELEASE_VERSION="${{ inputs.version || github.ref_name }}"
          APP_VERSION="${RELEASE_VERSION#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Install Linux Flutter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --build-name "$APP_VERSION" --build-number "${{ github.run_number }}"

      - name: Package tar.gz and deb
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="build/linux/x64/release/bundle"
          DIST_DIR="dist/linux"
          DEB_ROOT="$DIST_DIR/deb-root"
          PACKAGE_NAME="meituan-desk-pet"
          mkdir -p "$DIST_DIR"

          tar -C "$BUNDLE_DIR" \
            -czf "$DIST_DIR/${APP_DISPLAY_NAME}-linux-x64-${RELEASE_VERSION}.tar.gz" \
            .

          rm -rf "$DEB_ROOT"
          mkdir -p \
            "$DEB_ROOT/DEBIAN" \
            "$DEB_ROOT/opt/$PACKAGE_NAME" \
            "$DEB_ROOT/usr/bin" \
            "$DEB_ROOT/usr/share/applications"
          cp -a "$BUNDLE_DIR/." "$DEB_ROOT/opt/$PACKAGE_NAME/"
          ln -s "/opt/$PACKAGE_NAME/$APP_BINARY_NAME" "$DEB_ROOT/usr/bin/$PACKAGE_NAME"

          cat > "$DEB_ROOT/DEBIAN/control" <<CONTROL
          Package: $PACKAGE_NAME
          Version: $APP_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: MeiTuanDeskPet Contributors
          Depends: libgtk-3-0, libstdc++6, libblkid1, liblzma5
          Description: Photorealistic white cat desktop pet built with Flutter.
           A transparent, always-on-top desktop pet for macOS, Windows, and Linux.
          CONTROL

          cat > "$DEB_ROOT/usr/share/applications/$PACKAGE_NAME.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=$APP_DISPLAY_NAME
          Comment=Photorealistic white cat desktop pet
          Exec=$PACKAGE_NAME
          Terminal=false
          Categories=Utility;
          DESKTOP

          dpkg-deb --build "$DEB_ROOT" "$DIST_DIR/${APP_DISPLAY_NAME}-linux-x64-${RELEASE_VERSION}.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.deb
            dist/linux/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          RELEASE_VERSION="${{ inputs.version || github.ref_name }}"
          NOTES_PATH="release-notes/${RELEASE_VERSION}.md"
          if [[ ! -f "$NOTES_PATH" ]]; then
            NOTES_PATH="release-notes/default.md"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: find dist -maxdepth 2 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: MeiTuanDeskPet ${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes_path }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: dist/*
